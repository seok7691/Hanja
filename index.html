<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>한자어 뜻 탐정</title>
<style>
  :root{
    --cream:#FFF8EC;
    --cream2:#FFEFD6;
    --orange:#FF9F45;
    --orange-d:#E8791F;
    --navy:#1E2761;
    --navy-soft:#4A5490;
    --green:#3FAE7A;
    --green-d:#2E9366;
    --line:#F0DFC0;
    --accent:#FF6F91;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(180deg,var(--cream) 0%, var(--cream2) 100%);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    color:var(--navy);
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:16px;
  }
  .app{
    width:100%; max-width:1180px; flex:1;
    background:#fff; border-radius:28px;
    box-shadow:0 14px 0 rgba(232,121,31,0.15), 0 20px 36px rgba(30,39,97,0.10);
    padding:22px 30px 28px;
    display:flex; flex-direction:column;
  }

  /* ---------- top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand .logo{width:46px;height:46px;border-radius:14px;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:25px;color:#fff;font-weight:800;}
  .brand .name{font-size:20px;font-weight:800;}
  .brand .sub{font-size:13px;color:var(--navy-soft);font-weight:600;}
  .topright{display:flex;align-items:center;gap:10px;}
  .steps{display:flex;gap:8px;}
  .dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#C9BBA0;background:#F4EBDA;border:2px solid #F4EBDA;transition:all .18s;}
  .dot.active{background:var(--orange);color:#fff;border-color:var(--orange-d);transform:scale(1.1);}
  .dot.done{background:var(--green);color:#fff;border-color:var(--green-d);}
  .ghost{border:2px solid #E7E2D5;background:#fff;color:var(--navy-soft);border-radius:12px;height:44px;padding:0 16px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;}
  .ghost:hover{background:#FBF6EC;}

  /* ---------- shared ---------- */
  .stage{flex:1;display:flex;flex-direction:column;min-height:0;justify-content:center;}
  .kicker{font-size:17px;font-weight:800;color:var(--orange-d);margin-bottom:8px;}
  h2.page-title{font-size:clamp(22px,2.4vw,30px);font-weight:900;margin:4px 0 4px;}
  p.page-sub{font-size:17px;color:var(--navy-soft);margin:0 0 20px;font-weight:600;}

  .btn{border:none;border-radius:16px;padding:0 28px;height:58px;font-size:19px;font-weight:800;font-family:inherit;cursor:pointer;color:#fff;background:var(--orange);box-shadow:0 5px 0 var(--orange-d);display:inline-flex;align-items:center;gap:9px;transition:transform .1s;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--orange-d);}
  .btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
  .btn.soft{background:#EDEBFB;color:var(--navy);box-shadow:0 5px 0 #D8D4F3;}
  .btnrow{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap;}

  /* ---------- home ---------- */
  .session-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
  .session-card{border-radius:22px;padding:22px 20px;cursor:pointer;border:3px solid transparent;background:#FFF7EA;transition:transform .12s, box-shadow .12s;}
  .session-card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,39,97,.10);}
  .session-card .num{font-size:14px;font-weight:800;letter-spacing:.5px;}
  .session-card .subj{font-size:24px;font-weight:900;margin:6px 0 12px;}
  .session-card .words{font-size:17px;font-weight:700;color:var(--navy);line-height:1.7;}
  .session-card .cnt{margin-top:12px;font-size:13px;font-weight:700;color:var(--navy-soft);}

  /* ---------- word list ---------- */
  .word-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;}
  .word-card{border-radius:20px;padding:20px 18px;background:#FFF7EA;border:3px solid var(--line);cursor:pointer;text-align:center;position:relative;transition:transform .12s;}
  .word-card:hover{transform:translateY(-3px);}
  .word-card .h{font-size:40px;font-weight:900;line-height:1.1;}
  .word-card .r{font-size:17px;color:var(--navy-soft);font-weight:700;margin-top:4px;}
  .word-card .p{font-size:14px;color:var(--navy-soft);margin-top:10px;font-weight:600;}
  .word-card.done{background:#EAF7EF;border-color:#BEE9D0;}
  .word-card .check{position:absolute;top:10px;right:12px;font-size:20px;color:var(--green);font-weight:900;}

  /* ---------- flow ---------- */
  .flow{display:flex;gap:34px;flex:1;align-items:center;min-height:0;flex-wrap:wrap;}
  .col-l{flex:1 1 380px;min-width:300px;}
  .col-r{flex:1 1 380px;display:flex;align-items:center;justify-content:center;min-width:280px;}
  .hanja{font-size:clamp(56px,7vw,92px);font-weight:900;line-height:1.05;}
  .reading{font-size:24px;font-weight:700;color:var(--navy-soft);margin-bottom:18px;}
  .parts{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .part{background:#FDF0DD;border:2px solid var(--line);border-radius:14px;padding:10px 16px;font-size:18px;font-weight:700;}
  .part b{font-size:26px;color:var(--orange-d);margin-right:6px;}
  .ask{font-size:22px;font-weight:800;margin-bottom:10px;}
  .hint{font-size:16px;color:var(--navy-soft);line-height:1.5;font-weight:600;}
  textarea{width:100%;min-height:100px;font-size:20px;font-family:inherit;border:3px solid var(--orange);border-radius:18px;padding:16px 18px;color:var(--navy);font-weight:700;resize:none;background:#FFFDF7;line-height:1.5;}
  textarea:focus{outline:none;border-color:var(--orange-d);}
  .illust{width:min(400px,86vw);aspect-ratio:1/1;border-radius:28px;background:#FFF3E0;border:4px solid #FFD59A;display:flex;align-items:center;justify-content:center;padding:14px;}
  .illust svg{width:100%;height:100%;}
  .cmp{border-radius:18px;padding:16px 20px;border:3px solid var(--line);margin-bottom:14px;}
  .cmp.mine{background:#FFF3E0;border-color:#FFD59A;}
  .cmp.real{background:#EAF7EF;border-color:#BEE9D0;}
  .cmp .lab{font-size:14px;font-weight:800;margin-bottom:6px;}
  .cmp.mine .lab{color:var(--orange-d);}
  .cmp.real .lab{color:var(--green-d);}
  .cmp .txt{font-size:19px;font-weight:700;line-height:1.45;}
  .done-wrap{text-align:center;width:100%;}
  .done-wrap .big{font-size:38px;font-weight:900;margin:10px 0 6px;}
  .done-wrap .sub{font-size:18px;color:var(--navy-soft);font-weight:600;margin-bottom:20px;}
  .summary{max-width:640px;margin:0 auto;text-align:left;}
  .note{font-size:15px;color:var(--navy-soft);font-weight:700;margin-top:6px;}
  @media (max-width:760px){
    .app{padding:16px 16px 22px;}
    .flow{gap:18px;}
    .brand .sub{display:none;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand" onclick="goHome()">
      <div class="logo">漢</div>
      <div>
        <div class="name">한자어 뜻 탐정</div>
        <div class="sub">한자 두 글자로 낱말의 뜻을 추론해요</div>
      </div>
    </div>
    <div class="topright" id="topright"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script>
/* ============ 낱말 데이터 (5개 교과 × 5낱말 = 25낱말) ============ */
const SESSIONS = [
  { n:1, subject:"국어", color:"#FF6F91", words:[
    { w:"共有", r:"공유", p:[["共","함께 공"],["有","있을 유"]], m:"하나를 여럿이 함께 가지거나 나누어 씀", i:"gongyu" },
    { w:"集中", r:"집중", p:[["集","모을 집"],["中","가운데 중"]], m:"한 가지 일에 마음이나 힘을 모음", i:"jipjung" },
    { w:"現在", r:"현재", p:[["現","나타날 현"],["在","있을 재"]], m:"지금 이때, 지금 있는 때", i:"hyeonjae" },
    { w:"觀點", r:"관점", p:[["觀","볼 관"],["點","점 점"]], m:"사물이나 현상을 바라보는 방향이나 입장", i:"gwanjeom" },
    { w:"未來", r:"미래", p:[["未","아닐 미"],["來","올 래"]], m:"아직 오지 않은 앞으로의 때", i:"mirae" },
  ]},
  { n:2, subject:"수학", color:"#2BB3A3", words:[
    { w:"分數", r:"분수", p:[["分","나눌 분"],["數","셀 수"]], m:"전체를 몇 개로 똑같이 나눈 것 중 얼마인지를 나타내는 수", i:"bunsu" },
    { w:"約數", r:"약수", p:[["約","맺을 약"],["數","셀 수"]], m:"어떤 수를 나누어떨어지게 하는 수", i:"yaksu" },
    { w:"配列", r:"배열", p:[["配","짝 배"],["列","벌일 열"]], m:"일정한 차례나 간격으로 죽 벌여 놓음", i:"baeyeol" },
    { w:"平均", r:"평균", p:[["平","평평할 평"],["均","고를 균"]], m:"여러 수를 고르게 하여 만든 중간 값", i:"pyeonggyun" },
    { w:"點", r:"점", p:[["點","점 점"]], m:"크기는 없고 위치만 나타내는 표시", i:"jeom" },
  ]},
  { n:3, subject:"도덕", color:"#7C6FF0", words:[
    { w:"共通", r:"공통", p:[["共","함께 공"],["通","통할 통"]], m:"여럿 사이에 두루 통하고 같음", i:"gongtong" },
    { w:"自主", r:"자주", p:[["自","스스로 자"],["主","주될 주"]], m:"남에게 기대지 않고 스스로 판단하여 행동함", i:"jaju" },
    { w:"流出", r:"유출", p:[["流","흐를 류"],["出","날 출"]], m:"안에 있던 것이 밖으로 흘러 나감", i:"yuchul" },
    { w:"侵害", r:"침해", p:[["侵","침노할 침"],["害","해할 해"]], m:"남의 권리나 영역을 함부로 넘어 들어가 해침", i:"chimhae" },
    { w:"反省", r:"반성", p:[["反","돌이킬 반"],["省","살필 성"]], m:"자기의 말이나 행동을 돌이켜 살펴봄", i:"banseong" },
  ]},
  { n:4, subject:"사회", color:"#F2A03D", words:[
    { w:"觀光", r:"관광", p:[["觀","볼 관"],["光","빛 광"]], m:"다른 지역의 경치나 문화를 구경하며 다님", i:"gwangwang" },
    { w:"採集", r:"채집", p:[["採","캘 채"],["集","모을 집"]], m:"널리 찾아서 얻어 모음", i:"chaejip" },
    { w:"自然災害", r:"자연재해", p:[["自然","스스로 그러함"],["災害","재앙 재 · 해할 해"]], m:"자연 현상 때문에 생기는 피해", i:"jayeon" },
    { w:"輸出", r:"수출", p:[["輸","나를 수"],["出","날 출"]], m:"국내의 물품을 외국으로 팔아 내보냄", i:"suchul" },
    { w:"密度", r:"밀도", p:[["密","빽빽할 밀"],["度","정도 도"]], m:"일정한 공간 안에 빽빽하게 들어찬 정도", i:"mildo" },
  ]},
  { n:5, subject:"과학", color:"#3FAE7A", words:[

    { w:"溫度", r:"온도", p:[["溫","따뜻할 온"],["度","정도 도"]], m:"따뜻하거나 찬 정도", i:"ondo" },
    { w:"假說", r:"가설", p:[["假","임시 가"],["說","말씀 설"]], m:"어떤 사실을 설명하려고 임시로 세운 생각", i:"gaseol" },
    { w:"物體", r:"물체", p:[["物","물건 물"],["體","몸 체"]], m:"모양과 부피를 가지고 있는 물건", i:"mulche" },
    { w:"平衡", r:"평형", p:[["平","평평할 평"],["衡","저울대 형"]], m:"어느 한쪽으로 기울지 않고 고름", i:"pyeonghyeong" },
  ]},
];

/* ============ 손그림 느낌 일러스트 ============ */
const NV="#1E2761", OR="#FF9F45", PK="#FF6F91", GR="#3FAE7A", SD="#F4B860", BL="#7C9DF0";
function svg(inner){
  return '<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">'
    + '<defs><filter id="wb"><feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="5" result="t"/>'
    + '<feDisplacementMap in="SourceGraphic" in2="t" scale="3.2"/></filter></defs>'
    + '<g filter="url(#wb)" stroke-linecap="round" stroke-linejoin="round">' + inner + '</g></svg>';
}
function kid(cx, cy, fill, r){
  r = r || 26;
  return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'" stroke="'+NV+'" stroke-width="5"/>'
   + '<circle cx="'+(cx-9)+'" cy="'+(cy-6)+'" r="3.6" fill="'+NV+'"/>'
   + '<circle cx="'+(cx+9)+'" cy="'+(cy-6)+'" r="3.6" fill="'+NV+'"/>'
   + '<path d="M'+(cx-9)+' '+(cy+7)+' Q'+cx+' '+(cy+16)+' '+(cx+9)+' '+(cy+7)+'" stroke="'+NV+'" stroke-width="3.5" fill="none"/>';
}
const ILL = {
  gongyu: svg(
    '<circle cx="150" cy="130" r="62" fill="'+SD+'" stroke="'+NV+'" stroke-width="5"/>'
   +'<circle cx="126" cy="112" r="6.5" fill="#8C5A2B"/><circle cx="172" cy="108" r="5.5" fill="#8C5A2B"/>'
   +'<circle cx="150" cy="146" r="5.5" fill="#8C5A2B"/><circle cx="120" cy="150" r="5" fill="#8C5A2B"/>'
   +'<line x1="150" y1="68" x2="150" y2="192" stroke="'+NV+'" stroke-width="4" stroke-dasharray="9 7"/>'
   +'<path d="M82 264 L82 286" stroke="'+NV+'" stroke-width="8"/>'
   +'<path d="M56 286 q26 16 52 0" stroke="'+GR+'" stroke-width="14" fill="none"/>'
   +'<path d="M218 264 L218 286" stroke="'+NV+'" stroke-width="8"/>'
   +'<path d="M192 286 q26 16 52 0" stroke="'+BL+'" stroke-width="14" fill="none"/>'
   + kid(82,238,OR) + kid(218,238,PK)
   +'<path d="M104 212 Q126 190 134 178" stroke="'+OR+'" stroke-width="9" fill="none"/>'
   +'<path d="M196 212 Q174 190 166 178" stroke="'+PK+'" stroke-width="9" fill="none"/>'
  ),
  jipjung: svg(
    '<circle cx="150" cy="150" r="26" fill="'+OR+'" stroke="'+NV+'" stroke-width="5"/>'
   +['M40,60 L112,122','M260,60 L188,122','M40,240 L112,178','M260,240 L188,178','M150,30 L150,110','M150,270 L150,190']
      .map(function(d){return '<path d="'+d+'" stroke="'+NV+'" stroke-width="5" fill="none" marker-end=""/>';}).join('')
   +['112,122 100,112 104,128','188,122 200,112 196,128','112,178 100,188 104,172','188,178 200,188 196,172','150,110 142,98 158,98','150,190 142,202 158,202']
      .map(function(p){return '<polygon points="'+p+'" fill="'+NV+'"/>';}).join('')
  ),
  hyeonjae: svg(
    '<line x1="28" y1="180" x2="272" y2="180" stroke="'+NV+'" stroke-width="5"/>'
   +'<circle cx="80" cy="180" r="9" fill="#CBD2E8" stroke="'+NV+'" stroke-width="4"/>'
   +'<circle cx="220" cy="180" r="9" fill="#CBD2E8" stroke="'+NV+'" stroke-width="4"/>'
   +'<circle cx="150" cy="180" r="22" fill="'+OR+'" stroke="'+NV+'" stroke-width="5"/>'
   +'<text x="150" y="132" font-size="26" font-weight="800" fill="'+NV+'" text-anchor="middle" font-family="sans-serif">지금</text>'
   +'<path d="M150 142 L150 156" stroke="'+NV+'" stroke-width="5"/><polygon points="150,158 142,146 158,146" fill="'+NV+'"/>'
   +'<text x="80" y="218" font-size="17" fill="'+NV+'" text-anchor="middle" font-family="sans-serif">지난날</text>'
   +'<text x="220" y="218" font-size="17" fill="'+NV+'" text-anchor="middle" font-family="sans-serif">올 날</text>'
  ),
  gwanjeom: svg(
    '<rect x="122" y="106" width="56" height="88" rx="8" fill="'+SD+'" stroke="'+NV+'" stroke-width="5"/>'
   +'<ellipse cx="150" cy="106" rx="28" ry="11" fill="#FFE2B0" stroke="'+NV+'" stroke-width="5"/>'
   +'<ellipse cx="46" cy="150" rx="26" ry="17" fill="#fff" stroke="'+NV+'" stroke-width="5"/><circle cx="46" cy="150" r="8" fill="'+NV+'"/>'
   +'<ellipse cx="254" cy="150" rx="26" ry="17" fill="#fff" stroke="'+NV+'" stroke-width="5"/><circle cx="254" cy="150" r="8" fill="'+NV+'"/>'
   +'<path d="M76 150 L116 150" stroke="'+PK+'" stroke-width="4" stroke-dasharray="8 6"/>'
   +'<path d="M224 150 L184 150" stroke="'+BL+'" stroke-width="4" stroke-dasharray="8 6"/>'
   +'<rect x="26" y="206" width="40" height="28" rx="5" fill="none" stroke="'+PK+'" stroke-width="4"/>'
   +'<ellipse cx="254" cy="220" rx="21" ry="13" fill="none" stroke="'+BL+'" stroke-width="4"/>'
  ),
  mirae: svg(
    '<line x1="26" y1="210" x2="240" y2="210" stroke="'+NV+'" stroke-width="5"/>'
   +'<polygon points="272,210 234,192 234,228" fill="'+OR+'" stroke="'+NV+'" stroke-width="5"/>'
   +'<circle cx="70" cy="210" r="8" fill="#CBD2E8" stroke="'+NV+'" stroke-width="4"/>'
   +'<circle cx="130" cy="210" r="8" fill="#CBD2E8" stroke="'+NV+'" stroke-width="4"/>'
   +'<path d="M196 96 l10 24 24 10 -24 10 -10 24 -10 -24 -24 -10 24 -10z" fill="'+SD+'" stroke="'+NV+'" stroke-width="4"/>'
   +'<path d="M118 120 l6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6z" fill="#FFE2B0" stroke="'+NV+'" stroke-width="3.5"/>'
  ),
  bunsu: svg(
    '<circle cx="150" cy="140" r="78" fill="#fff" stroke="'+NV+'" stroke-width="5"/>'
   +'<path d="M150 140 L150 62 A78 78 0 0 1 228 140 Z" fill="'+OR+'" stroke="'+NV+'" stroke-width="5"/>'
   +'<line x1="150" y1="62" x2="150" y2="218" stroke="'+NV+'" stroke-width="5"/>'
   +'<line x1="72" y1="140" x2="228" y2="140" stroke="'+NV+'" stroke-width="5"/>'
   +'<text x="150" y="268" font-size="40" font-weight="800" fill="'+NV+'" text-anchor="middle" font-family="sans-serif">1 / 4</text>'
  ),
  yaksu: svg(
    '<text x="150" y="50" font-size="26" font-weight="800" fill="'+NV+'" text-anchor="middle" font-family="sans-serif">12개</text>'
   + (function(){var s='';for(var r=0;r<3;r++){for(var c=0;c<4;c++){s+='<circle cx="'+(84+c*44)+'" cy="'+(104+r*54)+'" r="16" fill="'+OR+'" stroke="'+NV+'" stroke-width="4"/>';}}return s;})()
   +'<rect x="60" y="80" width="192" height="156" rx="12" fill="none" stroke="'+GR+'" stroke-width="4" stroke-dasharray="10 7"/>'
   +'<text x="150" y="268" font-size="22" font-weight="800" fill="'+GR+'" text-anchor="middle" font-family="sans-serif">3줄 × 4개</text>'
  ),

/* ============ 상태 ============ */
let view = "home";     // home | list | flow
let curS = 0, curW = 0, step = 1;
const answers = {};    // { "1-0": {hypo, rev} }
const doneSet = {};    // { "1-0": true }

const stageEl = document.getElementById("stage");
const topEl = document.getElementById("topright");

function key(s,w){ return s+"-"+w; }
function esc(t){ return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ============ 화면 ============ */
function goHome(){ view="home"; render(); }
function openSession(i){ curS=i; view="list"; render(); }
function openWord(i){ curW=i; step=1; view="flow"; render(); }
function go(n){ step=n; render(); }

function saveHypo(){
  const v = document.getElementById("hypo").value.trim();
  const k = key(curS,curW);
  answers[k] = answers[k] || {};
  answers[k].hypo = v;
  go(3);
}
function saveRev(){
  const v = document.getElementById("rev").value.trim();
  const k = key(curS,curW);
  answers[k] = answers[k] || {};
  answers[k].rev = v;
  doneSet[k] = true;
  go(6);
}
function nextWord(){
  const list = SESSIONS[curS].words;
  if (curW < list.length - 1) { openWord(curW + 1); }
  else { view = "list"; render(); }
}

function renderTop(){
  if (view === "flow") {
    let dots = "";
    for (let i=1;i<=6;i++){
      const cls = i===step ? "dot active" : (i<step ? "dot done" : "dot");
      dots += '<div class="'+cls+'">'+(i<step?"✓":i)+'</div>';
    }
    topEl.innerHTML = '<div class="steps">'+dots+'</div>'
      + '<button class="ghost" onclick="view=\'list\';render()">낱말 목록</button>';
  } else if (view === "list") {
    topEl.innerHTML = '<button class="ghost" onclick="goHome()">차시 선택으로</button>';
  } else {
    topEl.innerHTML = '';
  }
}

function render(){
  renderTop();
  if (view === "home") return renderHome();
  if (view === "list") return renderList();
  return renderFlow();
}

function renderHome(){
  const cards = SESSIONS.map(function(s, i){
    const done = s.words.filter(function(_,wi){ return doneSet[key(i,wi)]; }).length;
    return '<div class="session-card" style="border-color:'+s.color+'33;background:'+s.color+'12" onclick="openSession('+i+')">'
      + '<div class="num" style="color:'+s.color+'">'+s.n+'차시</div>'
      + '<div class="subj">'+s.subject+'</div>'
      + '<div class="words">'+s.words.map(function(w){return w.w;}).join(" · ")+'</div>'
      + '<div class="cnt">'+done+' / '+s.words.length+' 낱말 완료</div>'
      + '</div>';
  }).join("");
  stageEl.innerHTML = '<div class="kicker">오늘의 공부</div>'
    + '<h2 class="page-title">어느 교과의 낱말을 추론해 볼까요?</h2>'
    + '<p class="page-sub">이미 배운 한자 두 글자를 합쳐서, 처음 보는 낱말의 뜻을 스스로 짐작해 봅시다.</p>'
    + '<div class="session-grid">'+cards+'</div>';
}

function renderList(){
  const s = SESSIONS[curS];
  const cards = s.words.map(function(w, i){
    const isDone = !!doneSet[key(curS,i)];
    return '<div class="word-card'+(isDone?" done":"")+'" onclick="openWord('+i+')">'
      + (isDone ? '<div class="check">✓</div>' : '')
      + '<div class="h">'+w.w+'</div><div class="r">'+w.r+'</div>'
      + '<div class="p">'+w.p.map(function(pp){return pp[0]+" "+pp[1];}).join(" + ")+'</div></div>';
  }).join("");
  stageEl.innerHTML = '<div class="kicker" style="color:'+s.color+'">'+s.n+'차시 · '+s.subject+'</div>'
    + '<h2 class="page-title">낱말을 하나 골라 보세요</h2>'
    + '<p class="page-sub">한 낱말씩 6단계로 추론하고, 끝나면 초록색으로 표시돼요.</p>'
    + '<div class="word-grid">'+cards+'</div>';
}

function renderFlow(){
  const s = SESSIONS[curS], w = s.words[curW];
  const a = answers[key(curS,curW)] || {};
  const hypo = a.hypo || "";
  const rev = a.rev || "";
  const partsHtml = w.p.map(function(pp){ return '<div class="part"><b>'+pp[0]+'</b>'+pp[1]+'</div>'; }).join("");
  let html = "";

  if (step === 1){
    html = '<div class="flow"><div class="col-l">'
      + '<div class="kicker">1단계 · 단어 제시</div>'
      + '<div class="hanja">'+w.w+'</div><div class="reading">'+w.r+'</div>'
      + '<div class="parts">'+partsHtml+'</div>'
      + '<div class="ask">이 한자들이 만나면 무슨 뜻이 될까요?</div>'
      + '<div class="hint">이미 배운 한자의 뜻을 떠올리며 낱말의 의미를 짐작해 보세요.</div>'
      + '<div class="btnrow"><button class="btn" onclick="go(2)">🤔 가설 입력하기</button></div>'
      + '</div><div class="col-r"><div class="illust" style="border-style:solid;background:#FDF0DD">'
      + '<div style="font-size:clamp(70px,11vw,120px)">🧐</div></div></div></div>';
  }
  else if (step === 2){
    html = '<div class="col-l" style="width:100%">'
      + '<div class="kicker">2단계 · 가설 입력</div>'
      + '<div class="hanja" style="font-size:clamp(40px,5vw,60px)">'+w.w+' <span style="font-size:22px;color:var(--navy-soft)">('+w.r+')</span></div>'
      + '<div class="ask" style="margin-top:14px">나의 생각을 자유롭게 적어 보세요</div>'
      + '<textarea id="hypo" placeholder="예) 두 한자의 뜻을 합치면 ~인 것 같다">'+esc(hypo)+'</textarea>'
      + '<div class="btnrow"><button class="btn" onclick="saveHypo()">✏️ 확인하기</button>'
      + '<button class="btn soft" onclick="go(1)">← 다시 보기</button></div></div>';
  }
  else if (step === 3){
    html = '<div class="flow"><div class="col-l">'
      + '<div class="kicker">3단계 · 시각화 확인</div>'
      + '<div class="ask">그림으로 낱말의 뜻을 확인해 보세요</div>'
      + '<div class="cmp mine"><div class="lab">나의 가설</div><div class="txt">'+(esc(hypo)||"(적지 않음)")+'</div></div>'
      + '<div class="hint">그림과 내 생각이 얼마나 비슷한지 살펴보세요.</div>'
      + '<div class="btnrow"><button class="btn" onclick="go(4)">👀 실제 뜻과 비교하기</button></div>'
      + '</div><div class="col-r"><div class="illust">'+(ILL[w.i]||"")+'</div></div></div>';
  }
  else if (step === 4){
    html = '<div class="flow"><div class="col-l">'
      + '<div class="kicker">4단계 · 즉시 비교</div>'
      + '<div class="hanja" style="font-size:clamp(36px,4.6vw,54px);margin-bottom:14px">'+w.w+'</div>'
      + '<div class="cmp mine"><div class="lab">나의 가설</div><div class="txt">'+(esc(hypo)||"(적지 않음)")+'</div></div>'
      + '<div class="cmp real"><div class="lab">실제 뜻</div><div class="txt">'+w.m+'</div></div>'
      + '<div class="btnrow"><button class="btn" onclick="go(5)">🔧 내 생각 고쳐 쓰기</button></div>'
      + '</div><div class="col-r"><div class="illust">'+(ILL[w.i]||"")+'</div></div></div>';
  }
  else if (step === 5){
    html = '<div class="col-l" style="width:100%">'
      + '<div class="kicker">5단계 · 자기수정</div>'
      + '<div class="ask">비교한 내용을 바탕으로 내 생각을 다시 써 보세요</div>'
      + '<div class="cmp real" style="margin-bottom:16px"><div class="lab">실제 뜻</div><div class="txt">'+w.m+'</div></div>'
      + '<textarea id="rev" placeholder="무엇이 맞았고 무엇이 달랐는지 함께 써 보세요">'+esc(rev)+'</textarea>'
      + '<div class="btnrow"><button class="btn green" onclick="saveRev()">✅ 다 고쳤어요</button>'
      + '<button class="btn soft" onclick="go(4)">← 다시 비교</button></div></div>';
  }
  else {
    const last = curW === s.words.length - 1;
    html = '<div class="done-wrap">'
      + '<div style="font-size:60px">🎉</div>'
      + '<div class="big">잘했어요!</div>'
      + '<div class="sub">'+w.w+'('+w.r+')의 뜻을 스스로 추론하고 확인했어요.</div>'
      + '<div class="summary">'
      + '<div class="cmp mine"><div class="lab">① 나의 첫 생각</div><div class="txt">'+(esc(hypo)||"(적지 않음)")+'</div></div>'
      + '<div class="cmp real"><div class="lab">② 실제 뜻</div><div class="txt">'+w.m+'</div></div>'
      + '<div class="cmp" style="background:#F4F2FF;border-color:#DCD7F8"><div class="lab" style="color:#6A5AE0">③ 내가 고쳐 쓴 생각</div><div class="txt">'+(esc(rev)||"(적지 않음)")+'</div></div>'
      + '<div class="note">위 내용을 활동지에 옮겨 적어 봅시다.</div></div>'
      + '<div class="btnrow" style="justify-content:center">'
      + '<button class="btn soft" onclick="go(1)">🔁 처음부터 다시</button>'
      + '<button class="btn" onclick="nextWord()">'+(last ? "📋 낱말 목록으로" : "➡️ 다음 낱말로")+'</button>'
      + '</div></div>';
  }
  stageEl.innerHTML = html;
  const ta = document.getElementById("hypo") || document.getElementById("rev");
  if (ta) ta.focus();
}

render();
</script>
</body>
</html>
